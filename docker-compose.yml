# docker-compose.yml
# Orquestração local e de borda (Raspberry Pi 5 / ARM64).
# Todos os containers utilizam PyTorch CPU-only (Dockerfile.api),
# sem necessidade do NVIDIA Container Toolkit ou drivers CUDA.

services:
  yolo-api:
    image: ghcr.io/alan-mendes-ufca/yolo-edge-api/yolo-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api  # Base Python 3.11 Slim + PyTorch CPU-only
    container_name: yolo-api
    ports:
      - "8000:8000"
    privileged: true             # Permite acesso aos nós de mídia e DMA da câmera (CSI/V4L2)
    volumes:
      - ./models:/app/models:ro  # Pesos somente-leitura
      - ./output:/app/output     # Resultados gravados aqui
      - ./images:/app/images:ro  # Imagens de teste
      - /dev:/dev                # Mapeia dispositivos de hardware do host
      - /run/udev:/run/udev:ro   # Permite ao libcamera identificar o sensor via udev
    environment:
      - MODEL_NAME=yolo-epi.pt
    networks:
      - yolo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  yolo-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: yolo-client
    volumes:
      - ./images:/client/images:ro
      - ./output:/client/output
    environment:
      - API_URL=http://yolo-api:8000
    networks:
      - yolo-net
    depends_on:
      yolo-api:
        condition: service_healthy

  yolo-stream:
    build:
      context: .
      dockerfile: Dockerfile.api    # Reutiliza a mesma base leve ARM64 / CPU-only
    container_name: yolo-stream
    ports:
      - "5000:5000"
    privileged: true              # Mesmo acesso à câmera do yolo-api
    volumes:
      - ./stream:/app/stream        # Código do módulo de streaming
      - ./models:/app/models:ro     # Pesos do modelo (read-only)
      - /dev:/dev                   # Dispositivos de hardware do host
      - /run/udev:/run/udev:ro      # Permite ao libcamera identificar o sensor via udev
    environment:
      - MODEL_NAME=yolo-epi.pt
    networks:
      - yolo-net
    command: >
      python3 stream/mjpeg_server.py
      --device 0
      --model models/yolo-epi.pt
      --infer-every 3
      --infer-size 320
      --port 5000
    restart: unless-stopped
    depends_on:
      - yolo-api

networks:
  yolo-net:
    driver: bridge
