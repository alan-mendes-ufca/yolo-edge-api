[pytest]
testpaths = tests
pythonpath = . app
addopts = -v --tb=short --strict-markers
markers =
    unit: Testes unitarios rapidos e isolados
    integration: Testes de integracao (incluindo inferencia com modelos reais)
    smoke: Testes de fumaca (saude e acessibilidade basica da API)
    camera: Testes relacionados a captura de camera fisica ou streaming
    preprocessor: Testes do pipeline de pre-processamento de imagens
    model: Testes do ciclo de vida e gerenciamento dos modelos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

